<style>
:root{color-scheme:light dark;--bg:#f6f5f2;--fg:#1c1b19;--mute:#6d6a64;--line:#d8d5ce;--acc:#2f5d62}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--fg:#ecebe7;--mute:#9a968d;--line:#2e2d29;--acc:#7fb3b8}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
     display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:360px}
h1{font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px}
p.h{color:var(--mute);font-size:13px;margin:0 0 22px}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
input{width:100%;padding:11px 13px;font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing:.18em;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:3px}
input:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
button{width:100%;margin-top:12px;padding:11px;font:600 14px/1 inherit;letter-spacing:.06em;
       background:var(--acc);color:#fff;border:0;border-radius:3px;cursor:pointer}
button[disabled]{opacity:.55;cursor:default}
.msg{margin-top:14px;font-size:13px;min-height:20px;color:var(--mute)}
.msg.err{color:#b4472f}
@media (prefers-color-scheme:dark){.msg.err{color:#e08b76}}
</style>
</head>
